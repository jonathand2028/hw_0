<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>AttendanceChimp tracks class attendance using QR codes that students photograph during lecture.</p>
    <hr>

    <p>Current time: {{ time }}</p>
    {% if user.is_authenticated %}
        <p class="username">{{ user.username }}</p>
    {% else %}
        <p>Not logged in.</p>
    {% endif %}

</div>
</body>
</html>
